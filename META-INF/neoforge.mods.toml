[[mods]]
modId="hw_patches_archive"
version="1.17.10"
displayName="[HW] Patches Archive"
description='''
Compatibility patch for Sable (Create Aeronautics), Immersive Portals, SecurityCraft, Sodium, Legendary Survival Overhaul, Vampirism, Enhanced AI and Voxy.
Every mod is optional: fixes are switched off automatically when a mod they need is not installed.
- Nether portals stay attached to Sable physics objects, can be lit on them, and link using the object's real position. (Sable + Immersive Portals)
- Blocks on physics objects can be broken next to portals. (Sable + Immersive Portals)
- SecurityCraft cameras work with Immersive Portals' chunk sending. (SecurityCraft + Immersive Portals)
- Chunks no longer flicker when a portal is seen through another portal. (Sodium + Immersive Portals)
- Physics objects shield from sun and rain: undead and vampires do not burn under them, rain does not wet through them. (Sable, + LSO)
- Heat and cold sources on physics objects affect body temperature. (Sable + LSO)
- Freezing vampires no longer get a hunger bar. (LSO + Vampirism)
- Zombies, skeletons and creepers ignore vampires again with Enhanced AI targeting. (Vampirism + Enhanced AI)
- Looking into a portal no longer replaces the whole screen with the other side (Voxy turned the stencil test off). Voxy LODs are also drawn behind portals (into the same or another dimension), clipped to the portal; Voxy's GPU memory is used for the player's dimension and, while seen, the dimensions behind portals; IP's "Voxy is incompatible" warning is removed. (Voxy + Immersive Portals)
- Voice no longer stutters while a portal into another dimension is visible, and players can talk through portals (also into other dimensions); the voice comes from the portal's direction. (Simple Voice Chat + Immersive Portals)
- IP's outdated Collective warning is removed. (Collective + Immersive Portals)
- Contraptions in other dimensions (seen through portals) get their spawn data and are visible; their Flywheel visuals keep ticking. (Create + Immersive Portals)
- No crash when a contraption has no data on the client. (Create Big Cannons + Create)
'''

# Every mixin is gated by CompatMixinPlugin on the mods it patches
[[mixins]]
config="hw_patches_archive.mixins.json"

[[mixins]]
config="hw_patches_archive.cortexvoxy.mixins.json"

[[mixins]]
config="hw_patches_archive.cortexvoxy.v0215.mixins.json"

[[mixins]]
config="hw_patches_archive.sodium.mixins.json"

[[dependencies.hw_patches_archive]]
    modId="neoforge"
    type="required"
    ordering="NONE"
    side="BOTH"

